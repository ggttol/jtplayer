name: JTplayer
options:
  bundleIdPrefix: dev.gaotao
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '17.0'
packages:
  AmplayerKit:
    path: Packages/AmplayerKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  JTplayer:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/Demo"]
      # 示例曲按文件夹打包，运行时从 Bundle 的 Demo 子目录读取
      - path: App/Resources/Demo
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: App/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        PRODUCT_BUNDLE_IDENTIFIER: dev.gaotao.jtplayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CarPlay 音频权限要苹果批准后才能用于真机和上架；批下来之前只给模拟器
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Resources/CarPlay.entitlements
    dependencies:
      - package: AmplayerKit
        product: AmplayerKit
  JTplayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gaotao.jtplayer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JTplayer
    dependencies:
      - target: JTplayer
schemes:
  JTplayer:
    build:
      targets:
        JTplayer: all
    test:
      targets:
        - JTplayerUITests
